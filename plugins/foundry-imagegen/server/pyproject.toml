[project]
name = "foundry-imagegen"
version = "0.1.1"
description = "MCP server giving Claude image generation via a GPT-image model deployed on Microsoft Foundry."
authors = [
    { name = "Alistair Young", email = "avatar@arkane-systems.net" }
]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "filelock>=3.16",
    "httpx>=0.28",
    "mcp>=2.3,<3",
    "pillow>=11",
    "platformdirs>=4.3",
]

[project.scripts]
foundry-imagegen = "foundry_imagegen:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
